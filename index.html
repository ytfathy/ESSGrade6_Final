function Review(app) {
  const id = view.id, lesson = LESSONS.find(l => l.id === id), a = L(id).answers;
  const list = QS[id].map((q, i) => ({q, i, r: a[q.id]})).filter(x => x.r && (!view.only || !x.r.ok));
  app.innerHTML = `<div class="qhead"><div class="logo-slot light" data-logo></div><div style="flex:1;min-width:0"><div class="small mute">${view.only ? "Incorrect answers" : "All questions"}</div><h2>Review · ${esc(lesson.title)}</h2></div>
    <button class="btn btn-g" data-a="back">← Results</button></div>
    ${list.length ? `<div class="listen-strip"><span>🎧 <b>Prefer to listen?</b> Each question has its own Listen button.</span>${ttsBtn({all: "#app article.rev", text: "Read entire page", label: "Read every question on this page aloud"})}</div>` : ""}
    ${list.map(({q, i, r}) => {
      const g = {ok: r.ok, per: r.per, hit: r.hit, n: (r.hit || []).filter(Boolean).length};
      return `<article class="card rev ${r.ok ? "ok" : "bad"}" data-read><div class="qnum" style="display:flex;align-items:center;gap:10px;justify-content:space-between"><span>Question ${i + 1} · ${r.ok ? '<span style="color:var(--ok)">Correct</span>' : '<span style="color:var(--bad)">Incorrect</span>'}</span>${ttsBtn({mini: true, label: "Read this question and its answer aloud"})}</div>
        <div class="qtext" dir="auto">${esc(q.q)}</div>
        <div class="kv"><b>Your answer:</b> <span dir="auto">${esc(yourAnswerText(q, r.r))}</span></div>
        ${feedbackHTML(q, r.r, g)}<div class="chips" style="margin-top:10px">${srcChips(q)}</div></article>`;
    }).join("") || '<div class="card">Nothing to review.</div>'}`;
  app.querySelector('[data-a="back"]').onclick = () => go("done", {id});
}

/* ---------- COURSE REPORT ---------- */
function Report(app) {
  const o = overall();
  const rows = [...LESSONS.map(l => ({l, s: stats(l.id)})), ...q2Order.map(id => ({l: {title: "Quarter 2 · " + QD.lessons[id].fullTitle}, s: q2stats(id)}))];
  const attempted = rows.filter(x => x.s.ans);
  const best = attempted.length ? attempted.reduce((a, b) => b.s.acc > a.s.acc ? b : a) : null;
  const worst = attempted.length ? attempted.reduce((a, b) => b.s.acc < a.s.acc ? b : a) : null;
  const r = 70, c = 2 * Math.PI * r, segs = [[o.ok, "var(--ok)"], [o.bad, "var(--bad)"], [o.rem, "#e7edf4"]];
  let off = 0;
  const donut = `<svg width="180" height="180" viewBox="0 0 180 180" role="img" aria-label="Correct ${o.ok}, incorrect ${o.bad}, unanswered ${o.rem}">${segs.map(([v, col]) => { const len = c * v / o.total; const s = `<circle cx="90" cy="90" r="${r}" fill="none" stroke="${col}" stroke-width="22" stroke-dasharray="${len} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"/>`; off += len; return s; }).join("")}
    <text x="90" y="88" text-anchor="middle" font-size="28" font-weight="800" fill="var(--ink)">${o.pct}%</text><text x="90" y="110" text-anchor="middle" font-size="12" fill="var(--mute)">completed</text></svg>`;
  app.innerHTML = `<section class="card hero"><div class="logo-slot light" data-logo></div>
    <div class="txt"><h1>${o.all ? "Final Course Report" : "Course Performance Report"}</h1><p class="mute" style="margin:6px 0 0">${o.all ? "All lessons are complete. Here is the full performance summary." : `${o.done} of ${o.lessons} lessons completed so far. The final report is complete when every lesson is finished.`}</p></div>
    ${ring(o.acc, 120, accColor(o.acc), "Accuracy")}</section>
  <div class="grid g4">
    <div class="stat"><div class="v">${o.total}</div><div class="l">Total questions (all quarters)</div></div>
    <div class="stat teal"><div class="v">${o.ans}</div><div class="l">Answered</div></div>
    <div class="stat ok"><div class="v">${o.ok}</div><div class="l">Correct</div></div>
    <div class="stat bad"><div class="v">${o.bad}</div><div class="l">Incorrect</div></div>
  </div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card" style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center">${donut}
      <div class="small"><div><span style="color:var(--ok)">■</span> Correct: <b>${o.ok}</b></div><div><span style="color:var(--bad)">■</span> Incorrect: <b>${o.bad}</b></div><div><span style="color:#c9d3df">■</span> Unanswered: <b>${o.rem}</b></div><div style="margin-top:8px">Overall accuracy: <b>${o.acc}%</b></div><div>Completion: <b>${o.pct}%</b></div></div></div>
    <div class="card"><h2 style="margin-bottom:10px">Highlights</h2>
      <p>🏆 <b>Highest performing lesson:</b><br>${best ? `${esc(best.l.title)} — <b style="color:var(--ok)">${best.s.acc}%</b>` : '<span class="mute">Not available yet</span>'}</p>
      <p>📘 <b>Lowest performing lesson:</b><br>${worst ? `${esc(worst.l.title)} — <b style="color:var(--bad)">${worst.s.acc}%</b>` : '<span class="mute">Not available yet</span>'}</p>
      <p class="small mute">Lessons completed: ${o.done} / ${o.lessons}</p></div>
  </div>
  <section class="card" style="margin-top:16px"><h2>Lesson-by-lesson performance</h2>
    <div class="lbars">${rows.map(({l, s}) => `<div class="r"><span>${esc(l.title)}</span><div class="bar"><i class="c" style="width:${s.ok / s.total * 100}%"></i><i class="w" style="width:${s.bad / s.total * 100}%"></i></div><b style="text-align:right;color:${s.ans ? accColor(s.acc) : "var(--mute)"}">${s.ans ? s.acc + "%" : "—"}</b></div>`).join("")}</div>
    <div class="tbl"><table style="margin-top:12px"><thead><tr><th>Lesson</th><th class="n">Questions</th><th class="n">Answered</th><th class="n">Correct</th><th class="n">Incorrect</th><th class="n">Accuracy</th><th>Status</th></tr></thead><tbody>
    ${rows.map(({l, s}) => `<tr><td>${esc(l.title)}</td><td class="n">${s.total}</td><td class="n">${s.ans}</td><td class="n">${s.ok}</td><td class="n">${s.bad}</td><td class="n">${s.ans ? s.acc + "%" : "—"}</td><td>${statusBadge(s)}</td></tr>`).join("")}
    </tbody></table></div>
    <div class="actions" style="margin-top:16px"><button class="btn btn-g" id="reset">Reset all progress</button></div>
  </section>`;
  $("#reset").onclick = () => confirmBox("Reset all progress?", "This clears every answer in every lesson on this device. Your XP, badges and streak are kept.", () => { S = {lessons: {}, g: S.g, rev: S.rev}; save(); go("home"); });
}

/* ---------- AUDIT ---------- */
function Audit(app) {
  const A = DB.audit, rep = A.report;
  const tot = rep.reduce((t, r) => ({e: t.e + r.extracted, i: t.i + r.imported, m: t.m + r.missing}), {e: 0, i: 0, m: 0});
  const flagged = DB.questions.filter(q => q.flag);
  app.innerHTML = `<section class="card"><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div class="logo-slot light" data-logo></div><div><h1>PDF Extraction & Verification Report</h1><p class="mute" style="margin:4px 0 0">Every question was matched back to the text of its source PDF and page.</p></div></div></section>
  <div class="grid g4" style="margin-top:16px">
    <div class="stat"><div class="v">${rep.length}</div><div class="l">PDFs processed</div></div>
    <div class="stat teal"><div class="v">${overall().total}</div><div class="l">Questions on site (all quarters)</div></div>
    <div class="stat ok"><div class="v">${tot.m}</div><div class="l">Missing questions</div></div>
    <div class="stat"><div class="v">${overall().lessons}</div><div class="l">Lessons</div></div>
  </div>
  <section class="card" style="margin-top:16px"><h2>Per-PDF question count</h2><div class="tbl"><table style="margin-top:10px">
    <thead><tr><th>Source PDF</th><th class="n">Pages</th><th class="n">Extracted</th><th class="n">Imported</th><th class="n">Missing</th></tr></thead><tbody>
    ${rep.map(r => `<tr><td>${esc(r.file)}</td><td class="n">${r.pages}</td><td class="n">${r.extracted}</td><td class="n">${r.imported}</td><td class="n pass">${r.missing}</td></tr>`).join("")}
    <tr style="font-weight:800"><td>Total question occurrences</td><td></td><td class="n">${tot.e}</td><td class="n">${tot.i}</td><td class="n pass">${tot.m}</td></tr></tbody></table></div>
    <p class="small mute">Questions that appear in more than one PDF are imported once and tagged with every source (shown on each question), so ${tot.i} occurrences → ${A.unique} unique questions.</p></section>
  <section class="card" style="margin-top:16px"><h2>Checks</h2><ul>
    <li>✅ All ${rep.length} PDFs processed · ${LESSONS.length} lessons identified</li>
    <li>✅ Every question found in its source PDF text (${A.problems.length} problems)</li>
    <li>✅ All answer options preserved · every question has an automatic correction mechanism</li>
    <li>✅ Every question has an explanation or model answer; ${flagged.length} flagged for teacher review</li>
    <li>✅ Accidental duplicates: ${A.duplicates}</li>
    <li>ℹ️ Quarter 1: ${A.unique} worksheet questions · Quarter 2: ${overall().total - A.unique} textbook quiz questions (${esc(QD.source)}) · Total on site: ${overall().total}</li>
    ${A.notes.map(n => `<li>ℹ️ ${esc(n)}</li>`).join("")}</ul></section>
  <section class="card" style="margin-top:16px"><h2>Questions per lesson</h2><div class="tbl"><table style="margin-top:10px"><thead><tr><th>Lesson</th><th class="n">Questions</th></tr></thead><tbody>
    ${LESSONS.map(l => `<tr><td>${esc(l.unit)} — ${esc(l.title)}</td><td class="n">${QS[l.id].length}</td></tr>`).join("")}</tbody></table></div></section>
  <section class="card" style="margin-top:16px"><h2>Flagged for teacher review (${flagged.length})</h2><div class="tbl"><table style="margin-top:10px"><thead><tr><th>Question</th><th>Reason</th><th>Source</th></tr></thead><tbody>
    ${flagged.map(q => `<tr><td>${esc(q.q)}</td><td>${esc(q.flag)}</td><td>${q.sources.map(s => esc(s.file + " p." + s.page)).join("<br>")}</td></tr>`).join("")}</tbody></table></div></section>`;
}

TTS.mountBar();
G.init();
const y0 = restoreView();
render(); restoreScroll(y0); welcomeBack(Store.loadedAt);
Store.onRecover = () => { G.init(); const y = restoreView(); render(); restoreScroll(y); welcomeBack(Store.loadedAt); };   // a newer backup copy was found
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").then(() => navigator.serviceWorker.ready).then(() => caches.open("iee-g6ss-v1")).then(c => c.addAll([location.pathname, ...[...document.scripts].map(s => s.getAttribute("src")).filter(Boolean), LOGO_SRC])).catch(() => {});
const pre = $("#preload"), hide = () => pre.classList.add("out");
(document.fonts?.ready || Promise.resolve()).then(() => setTimeout(hide, 350)); setTimeout(hide, 1600);
})();
</script>
